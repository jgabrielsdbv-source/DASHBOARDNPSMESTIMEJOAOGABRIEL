<script>
const ADMIN_PASSWORD = 'Joaogabriel15';
const ORANGE = '#E35B23';
const ORANGE_DEEP = '#B8431A';

const GROUP_STYLE = {
  G1: { bar: '#3B82C4', bg: '#E3EEF7', text: '#1D4E77', label: 'G1', desc: 'Efici\u00eancia > 118%', icon: 'ti-trophy' },
  G2: { bar: '#4C9A4A', bg: '#E8F3E3', text: '#2C5B27', label: 'G2', desc: '100% a 118%', icon: 'ti-medal' },
  G3: { bar: '#D9A72C', bg: '#FBF1D9', text: '#8A6A12', label: 'G3', desc: '76% a 99%', icon: 'ti-award' },
  G4: { bar: '#F2A65A', bg: '#FDEEDD', text: '#9A5A1E', label: 'G4', desc: '0% a 75%', icon: 'ti-flag' },
  SM: { bar: '#D3D1C7', bg: '#F4F1EC', text: '#8B897F', label: 'SM', desc: 'Sem meta', icon: 'ti-help-circle' },
};
const GROUP_ORDER = ['G1', 'G2', 'G3', 'G4'];
const NEXT_TARGET_PCT = { G4: 76, G3: 100, G2: 118.5, G1: null, SM: null };
const NEXT_GROUP_NAME = { G4: 'G3', G3: 'G2', G2: 'G1', G1: null, SM: null };
const BAR_HEIGHT = { G1: 180, G2: 140, G3: 105, G4: 75 };

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function groupBy(rows, keyFn){ const map = {}; rows.forEach(r => { const k = keyFn(r); (map[k]=map[k]||[]).push(r); }); return map; }

function calcNPS(rows){
  const total = rows.length;
  const prom = rows.filter(r => r.grp === 'Promotor').length;
  const pas = rows.filter(r => r.grp === 'Passivo').length;
  const det = rows.filter(r => r.grp === 'Detrator').length;
  const nps = total ? Math.round((prom/total - det/total) * 100) : 0;
  return { nps, total, prom, pas, det,
    pProm: total ? Math.round(prom/total*100) : 0, pPas: total ? Math.round(pas/total*100) : 0, pDet: total ? Math.round(det/total*100) : 0 };
}

function classifyGroup(nps, meta){
  if (!meta || meta <= 0) return { group: 'SM', eficiencia: null };
  const eficiencia = (nps/meta) * 100;
  let group;
  if (eficiencia > 118) group = 'G1';
  else if (eficiencia >= 100) group = 'G2';
  else if (eficiencia >= 76) group = 'G3';
  else group = 'G4';
  return { group, eficiencia };
}

function promotersNeeded(prom, det, total, meta, group){
  const targetPct = NEXT_TARGET_PCT[group];
  if (targetPct == null || !meta || meta <= 0) return null;
  const targetNps = Math.min(100, meta * targetPct / 100);
  const t = targetNps / 100;
  if (t >= 1) return null;
  const numerator = t*total - (prom-det);
  if (numerator <= 0) return 0;
  return Math.ceil(numerator / (1-t));
}

function findKey(headers, test){ return headers.find(h => test(norm(h))); }
function findBestKey(headers, prefix){
  const cands = headers.filter(h => norm(h).startsWith(prefix));
  if (cands.length === 0) return undefined;
  if (cands.length === 1) return cands[0];
  const withEllipsis = cands.find(h => h.trim().endsWith('...'));
  if (withEllipsis) return withEllipsis;
  return cands.slice().sort((a,b) => a.length - b.length)[0];
}

function mapGroup(v){
  if (!v) return null;
  const s = String(v).trim();
  if (s === 'Promotor') return 'Promotor';
  if (s === 'Passivo') return 'Passivo';
  if (s === 'Detrator' || s === 'Depreciador') return 'Detrator';
  return null;
}
function mapQueue(v){
  const m = { 'CX/Elo':'PF MEI', 'CX VIP/Elo':'VIP', 'CX Noturno/Elo':'Noturno', 'CX VIP PJ/Elo':'VIP PJ' };
  return m[v] || v || 'Outra';
}
function formatDateCell(v){
  if (v instanceof Date && !isNaN(v.getTime())){
    const y = v.getUTCFullYear(), m = String(v.getUTCMonth()+1).padStart(2,'0'), d = String(v.getUTCDate()).padStart(2,'0');
    return y+'-'+m+'-'+d;
  }
  const s = String(v||'').trim();
  const mIso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (mIso) return mIso[0];
  const mBr = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (mBr){ let [, dd, mm, yy] = mBr; if (yy.length===2) yy='20'+yy; return yy+'-'+mm.padStart(2,'0')+'-'+dd.padStart(2,'0'); }
  return s.slice(0,10);
}

function parseNpsWorkbook(wb){
  const sheetName = wb.SheetNames.includes('Sheet0') ? 'Sheet0' : wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];
  const json = XLSX.utils.sheet_to_json(sheet, { raw:true, defval:'' });
  if (!json.length) throw new Error('Planilha vazia');
  const headers = Object.keys(json[0]);
  const kCase = findKey(headers, h => h.includes('casenumber'));
  const kGroup = findKey(headers, h => h.includes('nps_group'));
  const kComment = findBestKey(headers, 'q3');
  const kFo = findKey(headers, h => h.includes('createdby'));
  const kQueue = findKey(headers, h => h.includes('firstclassification'));
  const kProduto = findKey(headers, h => h.includes('classificationprocuct') || h.includes('classificationproduct'));
  const kTipo = findKey(headers, h => h.includes('classificationtype'));
  const kMotivo = findKey(headers, h => h.includes('classificationreason'));
  const kDate = findKey(headers, h => h.includes('end date') || h.includes('data de fim'));
  if (!kCase || !kGroup || !kFo) throw new Error('N\u00e3o encontrei as colunas esperadas (CaseNumber / NPS_GROUP / CreatedBy) nesta planilha.');
  const rows = [];
  json.forEach(r => {
    const grp = mapGroup(r[kGroup]);
    if (!grp) return;
    rows.push({
      case: String(r[kCase]||''), grp, comment: kComment ? String(r[kComment]||'').trim() : '',
      fo: String(r[kFo]||'').trim(), queue: mapQueue(r[kQueue]),
      produto: kProduto ? String(r[kProduto]||'N/A') : 'N/A', tipo: kTipo ? String(r[kTipo]||'N/A') : 'N/A', motivo: kMotivo ? String(r[kMotivo]||'N/A') : 'N/A',
      date: kDate ? formatDateCell(r[kDate]) : '',
    });
  });
  return rows;
}

function parseStructureWorkbook(wb){
  const sheetName = wb.SheetNames.includes('DADOS') ? 'DADOS' : wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];
  const rowsArr = XLSX.utils.sheet_to_json(sheet, { header:1, raw:false, defval:'' });
  let headerIdx=-1, colFo=-1, colNome=-1, colSup=-1, colCanal=-1, colSegmento=-1;
  for (let i=0; i<rowsArr.length; i++){
    const row = rowsArr[i].map(c => String(c).trim());
    const iFo = row.indexOf('FO'), iNome = row.indexOf('Nome'), iSup = row.indexOf('Primeiro gestor');
    if (iFo>=0 && iNome>=0 && iSup>=0){
      headerIdx=i; colFo=iFo; colNome=iNome; colSup=iSup;
      colCanal = row.findIndex(h => norm(h).includes('canal') && norm(h).includes('novo'));
      colSegmento = row.findIndex(h => norm(h).includes('segmento') && norm(h).includes('novo'));
      break;
    }
  }
  if (headerIdx === -1) throw new Error('N\u00e3o encontrei as colunas Nome / FO / Primeiro gestor nesta planilha.');
  const out = [];
  for (let i=headerIdx+1; i<rowsArr.length; i++){
    const row = rowsArr[i];
    const fo = row[colFo] ? String(row[colFo]).trim() : '';
    const nome = row[colNome] ? String(row[colNome]).trim() : '';
    if (!fo || fo === '-' || !nome) continue;
    const sup = row[colSup] ? String(row[colSup]).trim() : 'Sem supervisor';
    let canal = colCanal>=0 && row[colCanal] ? String(row[colCanal]).trim() : ''; if (canal==='-') canal='';
    let segmento = colSegmento>=0 && row[colSegmento] ? String(row[colSegmento]).trim() : ''; if (segmento==='-') segmento='';
    out.push({ fo, nome, supervisor: sup||'Sem supervisor', canal, segmento });
  }
  return out;
}

function parseMetasWorkbook(wb){
  const sheetName = wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];
  const json = XLSX.utils.sheet_to_json(sheet, { raw:true, defval:'' });
  if (!json.length) throw new Error('Planilha vazia');
  const headers = Object.keys(json[0]);
  const kCanal = findKey(headers, h => h.includes('canal'));
  const kSegmento = findKey(headers, h => h.includes('segmento') || h.includes('fila'));
  const kMeta = findKey(headers, h => h.includes('meta'));
  if (!kCanal || !kSegmento || !kMeta) throw new Error('N\u00e3o encontrei as colunas Canal / Segmento / Meta nesta planilha.');
  const metas = {};
  json.forEach(r => {
    const canal = String(r[kCanal]||'').trim();
    const segmento = String(r[kSegmento]||'').trim();
    const meta = parseFloat(String(r[kMeta]).replace(',', '.'));
    if (canal && segmento && !isNaN(meta)) metas[canal+'|'+segmento] = meta;
  });
  return metas;
}

function readFileAsWorkbook(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => { try { resolve(XLSX.read(e.target.result, { type:'array', cellDates:true })); } catch(err){ reject(err); } };
    reader.onerror = () => reject(new Error('Falha ao ler o arquivo'));
    reader.readAsArrayBuffer(file);
  });
}

/* ---------- deriva\u00e7\u00e3o de dados ---------- */
function getStructMap(){
  const m = {};
  structure.forEach(s => { m[s.fo] = s; });
  return m;
}

function getDATA(){
  const structMap = getStructMap();
  return npsRows.map(r => {
    const s = structMap[r.fo];
    return { ...r, operator: s ? s.nome : r.fo, supervisor: s ? s.supervisor : 'Sem supervisor (FO n\u00e3o encontrado)', canal: s ? s.canal : '', segmento: s ? s.segmento : '' };
  });
}

function getTeamData(DATA){
  if (adminMode) return DATA;
  if (lockedSupervisor) return DATA.filter(r => r.supervisor === lockedSupervisor);
  return DATA;
}

function buildOperatorGroups(rowsSource, structMap){
  const map = groupBy(rowsSource.filter(r => r.fo), r => r.fo);
  return Object.entries(map).map(([fo, rows]) => {
    const s = structMap[fo];
    const nome = s ? s.nome : fo;
    const supervisor = s ? s.supervisor : 'Sem supervisor (FO n\u00e3o encontrado)';
    const canal = s ? s.canal : '';
    const segmento = s ? s.segmento : '';
    const stats = calcNPS(rows);
    const meta = metas[canal+'|'+segmento];
    const { group, eficiencia } = classifyGroup(stats.nps, meta);
    const pn = promotersNeeded(stats.prom, stats.det, stats.total, meta, group);
    return { fo, nome, supervisor, canal, segmento, meta, ...stats, group, eficiencia, promotersNeeded: pn, rows };
  });
}

function exportExcel(filtered, operatorGroups, tree){
  const wb = XLSX.utils.book_new();
  const casosSheet = filtered.map(r => ({
    'Data': r.date, 'Caso': r.case, 'Grupo': r.grp, 'Fila': r.queue, 'Canal': r.canal, 'Segmento': r.segmento,
    'Operador': r.operator, 'Supervisor': r.supervisor, 'Produto': r.produto, 'Tipo': r.tipo, 'Motivo': r.motivo, 'Coment\u00e1rio': r.comment,
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(casosSheet), 'Casos');
  const gruposSheet = operatorGroups.map(op => ({
    'Operador': op.nome, 'Supervisor': op.supervisor, 'Canal': op.canal, 'Segmento': op.segmento,
    'Respostas': op.total, 'NPS': op.nps, 'Meta': op.meta ?? '', 'Efici\u00eancia %': op.eficiencia != null ? op.eficiencia.toFixed(1) : '',
    'Grupo': op.group, 'Promotoras p/ avan\u00e7ar': op.promotersNeeded ?? '',
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(gruposSheet), 'Grupos');
  const treeSheet = tree.map(t => ({ '\u00c1rvore (Produto > Tipo > Motivo)': t.key, 'Total': t.total, 'Detratoras': t.det, '% Detratoras': t.pctDet }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(treeSheet), '\u00c1rvores');
  const metaKeys = new Set(); Object.keys(metas).forEach(k => metaKeys.add(k));
  const metasSheet = Array.from(metaKeys).sort().map(k => { const [canal, segmento] = k.split('|'); return { 'Canal': canal, 'Segmento': segmento, 'Meta': metas[k] ?? '' }; });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(metasSheet), 'Metas');
  XLSX.writeFile(wb, 'dashboard_nps_mensal_' + new Date().toISOString().slice(0,10) + '.xlsx');
}

  }

  html += '<div class="card" style="padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">'
    + '<div style="min-width:0;"><p style="font-size:13px;font-weight:500;margin:0 0 2px;">Estrutura universal (operador, supervisor, canal, segmento)</p>'
    + '<p class="muted" style="font-size:12px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+(structMeta.fileName?esc(structMeta.fileName)+(structMeta.updatedAt?(' \u00b7 atualizado '+esc(structMeta.updatedAt)):''):'Usando estrutura padr\u00e3o')+'</p></div>'
    + '<div><input type="file" id="structFileInput" accept=".xlsx,.xls" onchange="handleStructureFile(this)">'
    + '<button onclick="document.getElementById(\'structFileInput\').click()"><i class="ti ti-upload" style="margin-right:4px;"></i>Enviar</button></div></div>';

  html += '<div class="card" style="padding:12px 14px;">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;">'
    + '<p style="font-size:13px;font-weight:500;margin:0;">Metas por canal + segmento'+(metasMeta.updatedAt?(' <span class="muted" style="font-weight:400;">&middot; atualizado '+esc(metasMeta.updatedAt)+'</span>'):'')+'</p>'
    + '<div style="display:flex;align-items:center;gap:8px;"><input type="file" id="metasFileInput" accept=".xlsx,.xls" onchange="handleMetasFile(this)">'
    + '<button onclick="document.getElementById(\'metasFileInput\').click()"><i class="ti ti-upload" style="margin-right:4px;"></i>Upload planilha de metas</button></div></div>';
  if (metaKeys.length === 0) html += '<p class="muted" style="font-size:12px;">Nenhuma combina\u00e7\u00e3o de canal/segmento encontrada ainda.</p>';
  metaKeys.forEach(k => {
    const [canal, segmento] = k.split('|');
    html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-top:0.5px solid var(--border);">'
      + '<span style="font-size:12.5px;">'+esc(canal||'sem canal')+' &middot; '+esc(segmento)+'</span>'
      + '<input type="number" value="'+(metas[k] ?? '')+'" placeholder="meta" onblur="updateMeta(\''+k.replace(/'/g,"\\'")+'\', this.value)" style="width:80px;font-size:12.5px;padding:4px 8px;">'
      + '</div>';
  });
  html += '</div>';

  if (error) html += '<p style="font-size:12px;color:var(--text-danger);">'+esc(error)+'</p>';
  html += '</div>';
  box.innerHTML = html;
}

function render(){
  renderAdminGate();
  renderAdminPanel();
  renderMascot();
  document.getElementById('captureDateLabel').textContent = new Date().toLocaleDateString('pt-BR');

  const structMap = getStructMap();
  const DATA = getDATA();
  const teamData = getTeamData(DATA);

  document.getElementById('lockedLabel').style.display = (!adminMode && lockedSupervisor) ? 'block' : 'none';
  if (!adminMode && lockedSupervisor) document.getElementById('lockedLabel').innerHTML = 'Equipe: <b style="color:#fff;">'+esc(lockedSupervisor)+'</b>';

  const dateOptions = Array.from(new Set(teamData.map(r => r.date).filter(Boolean))).sort();
  const segmentoOptions = Array.from(new Set(teamData.map(r => r.segmento).filter(Boolean))).sort();

  const effFrom = adminMode ? dateFrom : (selectedDate || '');
  const effTo = adminMode ? dateTo : (selectedDate || '');

  const filtered = teamData.filter(r => {
    if (effFrom && (!r.date || r.date < effFrom)) return false;
    if (effTo && (!r.date || r.date > effTo)) return false;
    if (segmentoFilter !== 'Todos' && r.segmento !== segmentoFilter) return false;
    return true;
  });

  /* filtro de datas */
  const dateRow = document.getElementById('adminDateRow');
  if (adminMode){
    dateRow.style.display = 'flex'; dateRow.style.marginBottom = '10px';
    dateRow.innerHTML = '<i class="ti ti-calendar" style="font-size:16px;color:var(--orange-deep);"></i>'
      + '<input type="date" value="'+dateFrom+'" onchange="setDateFrom(this.value)">'
      + '<span class="muted" style="font-size:13px;">at\u00e9</span>'
      + '<input type="date" value="'+dateTo+'" onchange="setDateTo(this.value)">'
      + '<button onclick="exportExcelClick()" style="font-size:12px;padding:6px 12px;border-radius:20px;background:var(--orange);color:#fff;border:none;margin-left:auto;">'
      + '<i class="ti ti-download" style="font-size:13px;vertical-align:-1px;margin-right:4px;"></i>Exportar Excel</button>';
  } else {
    dateRow.style.display = 'none'; dateRow.innerHTML = '';
  }

  /* chips de data */
  const chipsBox = document.getElementById('dateChips');
  let chipsHtml = '<button onclick="setSelectedDate(null)" style="flex-shrink:0;border-radius:10px;padding:8px 14px;text-align:center;'
    + (selectedDate===null ? 'background:var(--orange);color:#fff;border:1px solid var(--orange);' : 'background:var(--surface-2);color:var(--text-primary);border:0.5px solid var(--border);')
    + '"><div style="font-size:12px;font-weight:600;">M\u00eas todo</div></button>';
  dateOptions.forEach(d => {
    const parts = d.split('-'); const day = parts[2]; const m = parseInt(parts[1],10)-1;
    const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    const active = selectedDate === d;
    chipsHtml += '<button onclick="setSelectedDate('+(active?'null':("'"+d+"'"))+')" style="flex-shrink:0;border-radius:10px;padding:6px 12px;text-align:center;min-width:50px;'
      + (active ? 'background:var(--orange);color:#fff;border:1px solid var(--orange);' : 'background:var(--surface-2);color:var(--text-primary);border:0.5px solid var(--border);')
      + '"><div style="font-family:Sora,sans-serif;font-size:16px;font-weight:600;line-height:1;">'+day+'</div>'
      + '<div style="font-size:10px;text-transform:uppercase;opacity:0.8;">'+meses[m]+'</div></button>';
  });
  chipsBox.innerHTML = chipsHtml;

  /* KPIs */
  const kpiGeral = calcNPS(filtered);
  const kpiBySeg = {}; segmentoOptions.forEach(seg => { kpiBySeg[seg] = calcNPS(filtered.filter(r => r.segmento === seg)); });
  const kpiRow = document.getElementById('kpiRow');
  kpiRow.innerHTML = kpiCardHtml('NPS geral', kpiGeral, segmentoFilter==='Todos', "setSegmentoFilter('Todos')", true)
    + segmentoOptions.map(seg => kpiCardHtml(seg, kpiBySeg[seg], segmentoFilter===seg, "setSegmentoFilter('"+seg.replace(/'/g,"\\'")+"')", false)).join('');

  /* operator groups */
  const operatorGroupsRaw = buildOperatorGroups(filtered, structMap);
  const rank = { G1:0, G2:1, G3:2, G4:3, SM:4 };
  const operatorGroups = operatorGroupsRaw.sort((a,b) => (rank[a.group]-rank[b.group]) || ((a.eficiencia??999)-(b.eficiencia??999)));

  const groupCounts = { G1:0, G2:0, G3:0, G4:0 };
  operatorGroups.forEach(op => { if (groupCounts[op.group]!=null) groupCounts[op.group]++; });

  /* podio */
  document.getElementById('podium').innerHTML = GROUP_ORDER.map(g => podiumBarHtml(g, groupCounts[g], expandedGroup===g)).join('');
  document.getElementById('podiumHint').textContent = expandedGroup
    ? ('Mostrando s\u00f3 o ' + expandedGroup + '. Clique de novo na barra pra ver todo mundo.')
    : 'Mostrando todo mundo, do G1 ao G4. Clique numa barra pra filtrar s\u00f3 aquele grupo.';

  const visibleRoster = expandedGroup ? operatorGroups.filter(op => op.group === expandedGroup) : operatorGroups.filter(op => op.group !== 'SM');
  const rosterBox = document.getElementById('roster');
  rosterBox.innerHTML = visibleRoster.length === 0
    ? '<p class="muted" style="font-size:13px;padding:14px;margin:0;">Nenhum operador nesse filtro.</p>'
    : visibleRoster.map(op => operatorRowHtml(op, expandedOperator===op.fo)).join('');

  /* arvores */
  const treeMap = groupBy(filtered, r => r.produto+' \u2192 '+r.tipo+' \u2192 '+r.motivo);
  let tree = Object.entries(treeMap).map(([key, rows]) => {
    const det = rows.filter(r => r.grp==='Detrator').length;
    return { key, total: rows.length, det, pctDet: rows.length ? Math.round(det/rows.length*100) : 0 };
  }).filter(t => t.det > 0);
  tree = treeSort==='det' ? tree.sort((a,b)=>b.det-a.det).slice(0,12) : tree.sort((a,b)=>(b.pctDet-a.pctDet)||(b.det-a.det)).slice(0,12);
  const maxDet = Math.max(...tree.map(t=>t.det), 1);
  const treeBox = document.getElementById('treeBox');
  treeBox.innerHTML = tree.length === 0
    ? '<p class="muted" style="font-size:13px;margin:0;">Nenhuma detratora nesse filtro.</p>'
    : tree.map((t,i) => '<div style="padding:9px 0;'+(i===0?'':'border-top:0.5px solid var(--border);')+'">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;">'
        + '<span style="font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(t.key)+'</span>'
        + '<span class="muted" style="font-size:12px;flex-shrink:0;">'+t.det+' detratoras &middot; '+t.pctDet+'% do total</span></div>'
        + '<div style="background:var(--surface-1);border-radius:4px;height:7px;overflow:hidden;"><div style="width:'+Math.round(t.det/maxDet*100)+'%;height:100%;background:var(--orange);border-radius:4px;"></div></div></div>'
      ).join('');

  /* datalist de nomes */
  const monthWide = buildOperatorGroups(teamData, structMap);
  const names = Array.from(new Set(monthWide.map(op => op.nome))).sort();
  document.getElementById('op-names').innerHTML = names.map(n => '<option value="'+esc(n)+'">').join('');

  window._exportCtx = { filtered, operatorGroups, tree };
}

function exportExcelClick(){
  if (window._exportCtx) exportExcel(window._exportCtx.filtered, window._exportCtx.operatorGroups, window._exportCtx.tree);
}

function kpiCardHtml(label, stats, active, onclick, hero){
  return '<button onclick="'+onclick+'" style="text-align:left;cursor:pointer;border-radius:12px;padding:'+(hero?'1.25rem':'1rem')+';min-width:0;'
    + (active ? 'background:var(--orange);border:1px solid var(--orange);box-shadow:0 1px 3px rgba(227,91,35,0.35);' : 'background:var(--surface-2);border:0.5px solid var(--border);')
    + '">'
    + '<p style="font-size:11px;font-weight:500;letter-spacing:0.03em;text-transform:uppercase;margin:0 0 8px;color:'+(active?'rgba(255,255,255,0.85)':'var(--text-muted)')+';">'+esc(label)+'</p>'
    + '<p style="font-family:Sora,sans-serif;font-size:'+(hero?38:26)+'px;font-weight:600;margin:0 0 6px;color:'+(active?'#fff':'var(--text-primary)')+';">'+stats.nps+'</p>'
    + '<p style="font-size:12px;margin:0;color:'+(active?'rgba(255,255,255,0.75)':'var(--text-muted)')+';">'+stats.total+' respostas</p></button>';
}

function podiumBarHtml(group, count, active){
  const st = GROUP_STYLE[group]; const h = BAR_HEIGHT[group];
  return '<button onclick="setExpandedGroup(\''+group+'\')" style="background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;">'
    + '<p style="font-family:Sora,sans-serif;font-size:24px;font-weight:700;margin:0 0 6px;color:'+(active?st.text:'var(--text-primary)')+';">'+count+'</p>'
    + '<div style="width:100%;max-width:90px;height:'+h+'px;border-radius:10px 10px 4px 4px;background:'+st.bar+';opacity:'+(active?1:0.85)+';display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12px;'
    + (active ? ('box-shadow:0 0 0 3px '+st.bg+';') : '') + '">'
    + '<i class="ti '+st.icon+'" style="font-size:22px;color:rgba(255,255,255,0.95);"></i></div>'
    + '<p style="font-size:13px;font-weight:700;margin:8px 0 2px;color:var(--text-primary);">'+st.label+'</p>'
    + '<p style="font-size:10.5px;color:var(--text-muted);margin:0;text-align:center;">'+st.desc+'</p></button>';
}

function caseRowHtml(r){
  const style = r.grp==='Promotor' ? ['var(--bg-success)','var(--text-success)'] : r.grp==='Passivo' ? ['var(--bg-warning)','var(--text-warning)'] : ['var(--bg-danger)','var(--text-danger)'];
  return '<div style="display:flex;gap:10px;padding:9px 0;border-top:0.5px solid var(--border);align-items:flex-start;">'
    + '<span style="font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;background:'+style[0]+';color:'+style[1]+';flex-shrink:0;margin-top:1px;">'+esc(r.grp)+'</span>'
    + '<div style="min-width:0;flex:1;"><p class="muted" style="font-size:12px;margin:0 0 2px;">Caso '+esc(r.case)+' &middot; '+esc(r.date)+'</p>'
    + '<p style="font-size:13px;margin:0;color:'+(r.comment?'var(--text-primary)':'var(--text-muted)')+';">'+esc(r.comment||'Sem coment\u00e1rio')+'</p></div></div>';
}

function operatorRowHtml(op, expanded){
  const st = GROUP_STYLE[op.group];
  const nextName = NEXT_GROUP_NAME[op.group];
  let body = '';
  if (expanded){
    const sorted = op.rows.slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));
    body = '<div style="padding:0 12px 10px 34px;background:var(--surface-2);">'
      + (sorted.length===0 ? '<p class="muted" style="font-size:12px;">Sem respostas nesse filtro.</p>' : sorted.map(caseRowHtml).join('')) + '</div>';
  }
  let pwdBox = '';
  if (awaitingPasswordFor === op.fo){
    pwdBox = '<div style="padding:0 12px 12px 34px;background:var(--surface-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap;" onclick="event.stopPropagation()">'
      + '<i class="ti ti-lock" style="font-size:14px;color:var(--text-muted);"></i>'
      + '<span style="font-size:12px;color:var(--text-muted);">Senha de 3 d\\u00edgitos:</span>'
      + '<input id="pwd-input-'+op.fo+'" type="password" inputmode="numeric" maxlength="3" onkeydown="if(event.key===\'Enter\')submitOperatorPassword(\''+op.fo+'\')" style="width:60px;font-size:14px;padding:4px 8px;letter-spacing:0.2em;text-align:center;">'
      + '<button onclick="submitOperatorPassword(\''+op.fo+'\')" style="font-size:12px;padding:5px 12px;border-radius:6px;background:'+st.bar+';color:#fff;border:none;">Ver</button>'
      + (pwdError ? ('<span style="font-size:11.5px;color:var(--text-danger);">'+esc(pwdError)+'</span>') : '')
      + '</div>';
  }
  return '<div style="background:'+st.bg+';border-top:1px solid rgba(255,255,255,0.6);">'
    + '<button onclick="handleOperatorClick(\''+op.fo+'\')" style="width:100%;display:flex;flex-direction:column;gap:6px;padding:11px 12px;background:transparent;border:none;text-align:left;cursor:pointer;">'
    + '<span style="display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;">'
    + '<span style="display:flex;align-items:center;gap:8px;min-width:0;">'
    + '<i class="ti ti-chevron-'+(expanded?'down':'right')+'" style="font-size:14px;color:'+st.text+';flex-shrink:0;"></i>'
    + '<span style="font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:'+st.bar+';color:#fff;flex-shrink:0;">'+st.label+'</span>'
    + '<span style="font-size:13.5px;font-weight:500;color:'+st.text+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(op.nome)+'</span></span>'
    + '<span style="font-size:13px;font-weight:600;color:'+st.text+';flex-shrink:0;">'+(op.eficiencia!=null?op.eficiencia.toFixed(0)+'%':'-')+'</span></span>'
    + '<span style="font-size:11.5px;color:'+st.text+';opacity:0.8;padding-left:22px;">NPS '+op.nps+' / meta '+(op.meta??'-')+' &middot; '+op.total+' respostas &middot; '+esc(op.canal||'sem canal')+' &middot; '+esc(op.segmento||'sem segmento')+'</span>'
    + '<span style="display:flex;gap:6px;flex-wrap:wrap;padding-left:22px;">'
    + '<span style="font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;background:var(--bg-danger);color:var(--text-danger);">'+op.det+' det</span>'
    + '<span style="font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;background:var(--bg-warning);color:var(--text-warning);">'+op.pas+' pas</span>'
    + '<span style="font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;background:var(--bg-success);color:var(--text-success);">'+op.prom+' prom</span>'
    + '</span>'
    + (nextName && op.promotersNeeded!=null ? ('<span style="font-size:11.5px;color:#fff;background:'+st.bar+';border-radius:6px;padding:4px 8px;margin-left:22px;width:fit-content;">+'+op.promotersNeeded+' '+(op.promotersNeeded===1?'promotora':'promotoras')+' para '+nextName+'</span>') : '')
    + '</button>' + pwdBox + body + '</div>';
}

render();
</script>
</body>
</html>
